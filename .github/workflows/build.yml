name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube scan skipped
        if: ${{ vars.SONAR_ENABLE_CI_SCAN != 'true' }}
        run: |
          echo "Skipping CI SonarQube scan because SONAR_ENABLE_CI_SCAN is not true."
          echo "Use SonarCloud Automatic Analysis, or set SONAR_ENABLE_CI_SCAN=true after disabling Automatic Analysis."
      - name: Validate SonarQube configuration
        if: ${{ vars.SONAR_ENABLE_CI_SCAN == 'true' }}
        shell: bash
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SONAR_HOST_URL" =~ ^https?://[^[:space:]]+$ ]] || {
            echo "::error::SONAR_HOST_URL must be a complete http(s) URL"
            exit 1
          }
          [[ -n "$SONAR_TOKEN" ]] || {
            echo "::error::SONAR_TOKEN repository secret is not configured"
            exit 1
          }
      - name: SonarQube Scan
        if: ${{ vars.SONAR_ENABLE_CI_SCAN == 'true' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=nbhanu220904
            -Dsonar.projectKey=nbhanu220904_AI-Powered-Mock-Interview-Platform