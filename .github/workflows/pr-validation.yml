name: PR Validation

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

# Required for PR checks and repository access
permissions:
  contents: read
  pull-requests: read

# If a developer pushes another commit to the same PR,
# cancel the previous validation and validate the newest commit.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # CLIENT VALIDATION
  # ============================================================

  client-validation:

    name: PR - Client Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install client dependencies
        run: npm ci

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------

      - name: Run client lint
        run: npm run lint --if-present

      # --------------------------------------------------------
      # Unit tests
      # --------------------------------------------------------

      - name: Run client unit tests
        run: npm test --if-present

      # --------------------------------------------------------
      # Production build
      # --------------------------------------------------------

      - name: Build client
        run: npm run build


  # ============================================================
  # SERVER VALIDATION
  # ============================================================

  server-validation:

    name: PR - Server Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install server dependencies
        run: npm ci

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------

      - name: Run server lint
        run: npm run lint --if-present

      # --------------------------------------------------------
      # Unit tests
      # --------------------------------------------------------

      - name: Run server unit tests
        run: npm test --if-present

      # --------------------------------------------------------
      # Validate server JavaScript
      # --------------------------------------------------------

      - name: Validate server syntax
        run: |
          node --check server.js

      # --------------------------------------------------------
      # Build if build script exists
      # --------------------------------------------------------

      - name: Build server
        run: npm run build --if-present


  # ============================================================
  # PYTHON / PYTEST
  # ============================================================

  pytest:

    name: PR - PyTest

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyTest
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f server/requirements.txt ]; then
            pip install -r server/requirements.txt
          fi

          pip install pytest pytest-cov

      - name: Check for Python tests
        id: python-tests
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "tests_found=true" >> "$GITHUB_OUTPUT"

          else

            echo "tests_found=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Run PyTest
        if: steps.python-tests.outputs.tests_found == 'true'
        run: |
          pytest \
            --junitxml=pytest-results.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=term

      - name: No Python tests found
        if: steps.python-tests.outputs.tests_found == 'false'
        run: |
          echo "No Python tests found."
          echo "PyTest validation is currently not applicable."


  # ============================================================
  # SONARQUBE
  # ============================================================

  sonarqube:

    name: PR - SonarQube Analysis

    runs-on: ubuntu-latest

    needs:
      - client-validation
      - server-validation
      - pytest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # SonarQube
      # --------------------------------------------------------

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SONAR_HOST_URL" =~ ^https?://[^[:space:]]+$ ]] || {
            echo "::error::SONAR_HOST_URL must be a complete http(s) URL"
            exit 1
          }
          [[ -n "$SONAR_TOKEN" ]] || {
            echo "::error::SONAR_TOKEN repository secret is not configured"
            exit 1
          }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # --------------------------------------------------------
      # Optional Quality Gate
      # --------------------------------------------------------
      #
      # If your SonarQube configuration requires the workflow
      # itself to fail when the Quality Gate fails, enable this.
      #
      # SonarQube PR decoration can alternatively report the
      # Quality Gate directly on the GitHub PR.
      #

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}


  # ============================================================
  # FINAL PR GATE
  # ============================================================

  pr-validation:

    name: PR Validation - Final Gate

    runs-on: ubuntu-latest

    needs:
      - client-validation
      - server-validation
      - pytest
      - sonarqube

    if: ${{ always() }}

    steps:

      - name: Check validation results
        shell: bash
        run: |

          echo "======================================"
          echo "       PR VALIDATION RESULTS"
          echo "======================================"

          echo "Client      : ${{ needs.client-validation.result }}"
          echo "Server      : ${{ needs.server-validation.result }}"
          echo "PyTest      : ${{ needs.pytest.result }}"
          echo "SonarQube   : ${{ needs.sonarqube.result }}"

          echo "======================================"

          if [[ "${{ needs.client-validation.result }}" != "success" ]]; then
            echo "Client validation FAILED"
            exit 1
          fi

          if [[ "${{ needs.server-validation.result }}" != "success" ]]; then
            echo "Server validation FAILED"
            exit 1
          fi

          if [[ "${{ needs.pytest.result }}" != "success" ]]; then
            echo "PyTest FAILED"
            exit 1
          fi

          if [[ "${{ needs.sonarqube.result }}" != "success" ]]; then
            echo "SonarQube validation FAILED"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       PR VALIDATION PASSED"
          echo "======================================"
          echo ""
          echo "PR can be merge into dev."